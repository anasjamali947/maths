<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info Provider | Anas Jamali</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #080b14;
    color: #f1f5f9;
}

header {
    padding: 22px 8%;
    border-bottom: 1px solid #263247;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: 800;
}

.logo span {
    color: #38bdf8;
}

nav a {
    color: #94a3b8;
    text-decoration: none;
    margin-left: 18px;
}

.hero {
    text-align: center;
    padding: 75px 20px;
    background: radial-gradient(ellipse at top, #172c51, #080b14 70%);
}

.hero h1 {
    font-size: clamp(35px, 7vw, 65px);
    margin: 20px 0;
}

.gradient {
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    color: transparent;
    background-clip: text;
}

.hero p {
    color: #94a3b8;
    line-height: 1.8;
    margin-bottom: 25px;
}

.search {
    display: flex;
    max-width: 550px;
    margin: auto;
    gap: 10px;
}

.search input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #111827;
    color: white;
}

button, .download {
    padding: 13px 18px;
    background: #38bdf8;
    color: #07111c;
    border: none;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px 70px;
}

h2 {
    margin-bottom: 20px;
}

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
}

.categories button {
    background: #111827;
    border: 1px solid #334155;
    color: #cbd5e1;
}

.categories button.active {
    background: #164e63;
    color: #7dd3fc;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
}

.card {
    padding: 25px;
    background: linear-gradient(145deg, #121b2c, #0d1320);
    border: 1px solid #263247;
    border-radius: 17px;
}

.card:hover {
    border-color: #38bdf8;
}

.icon {
    font-size: 35px;
    margin-bottom: 15px;
}

.card h3 {
    margin-bottom: 12px;
}

.card p {
    color: #94a3b8;
    line-height: 1.7;
    font-size: 14px;
}

.meta {
    color: #a78bfa;
    margin: 17px 0;
    font-size: 12px;
}

.download {
    display: block;
    text-align: center;
}

.empty {
    color: #94a3b8;
    padding: 30px;
    grid-column: 1 / -1;
}

.about {
    margin-top: 65px;
    padding: 30px;
    background: #111827;
    border: 1px solid #263247;
    border-radius: 17px;
    line-height: 1.8;
}

.about p {
    color: #94a3b8;
}

footer {
    padding: 30px 15px;
    border-top: 1px solid #263247;
    color: #94a3b8;
    text-align: center;
    line-height: 2;
}

footer strong {
    color: #38bdf8;
}

@media (max-width: 750px) {
    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    header {
        padding: 18px 5%;
    }
}

@media (max-width: 500px) {
    .grid {
        grid-template-columns: 1fr;
    }

    nav a {
        margin-left: 8px;
        font-size: 12px;
    }

    .logo {
        font-size: 16px;
    }

    .search button {
        padding: 10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">INFO <span>PROVIDER.</span></div>
    <nav>
        <a href="#home">Home</a>
        <a href="#resources">Files</a>
        <a href="#about">About</a>
    </nav>
</header>

<section class="hero" id="home">
    <p>YOUR KNOWLEDGE HUB</p>

    <h1>
        Information.<br>
        <span
